name: Extras (pedidos programados y efemérides)

on:
  schedule:
    # Cada 30 minutos, de 11:07 a 23:37 (hora de Argentina), se fija si toca publicar.
    # El horario de cada día se cambia en config.json → "horarios".
    # Si GitHub se atrasa y se pasa la hora, publica igual apenas pueda (hasta 3 horas después).
    - cron: "22,52 * * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "Qué fabricar ahora: el pedido de hoy (data/pedidos.json) o la próxima efeméride de hoy"
        type: choice
        default: pedido
        options: [pedido, efemeride]
      publicar:
        description: "¿Publicar en las redes? (si no, solo genera y lo podés ver acá)"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  reloj:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      si: ${{ steps.toca.outputs.si }}
      modo: ${{ steps.toca.outputs.modo }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}  # siempre la última versión (con el historial de hoy al día)
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - id: toca
        name: ¿Toca un video extra ahora?
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MODO_MANUAL: ${{ inputs.modo }}
        run: python -m fabrica.main toca_extra
      - name: Guardar el ranking del día
        run: |
          git config user.name "fabrica-bot"
          git config user.email "fabrica-bot@users.noreply.github.com"
          git add data/efemerides.json data/efemerides-calendario.md data/tendencias.json data/estado.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Extras $(date +%F) [skip ci]"
          git push || (git pull --rebase && git push) || true

  fabricar:
    needs: reloj
    concurrency:
      group: fabrica-publicar
      cancel-in-progress: false
    if: needs.reloj.outputs.si == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      MODO: ${{ needs.reloj.outputs.modo }}
      POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YT_API_KEY: ${{ secrets.YT_API_KEY }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      IG_FB_TOKEN: ${{ secrets.IG_FB_TOKEN }}
      IG_FB_ID: ${{ secrets.IG_FB_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}  # siempre la última versión (con el historial de hoy al día)

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Modelo de Whisper (para sincronizar subtítulos) en caché
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-v1

      - name: Instalar herramientas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji > /dev/null
          pip install -q -r requirements.txt
          mkdir -p fonts
          for f in ofl/anton/Anton-Regular.ttf ofl/abrilfatface/AbrilFatface-Regular.ttf ofl/oldstandardtt/OldStandard-Bold.ttf ofl/poppins/Poppins-Regular.ttf ofl/poppins/Poppins-SemiBold.ttf ofl/poppins/Poppins-Bold.ttf ofl/poppins/Poppins-ExtraBold.ttf ofl/poppins/Poppins-Black.ttf; do
            curl -fsSL -o "fonts/$(basename $f)" "https://github.com/google/fonts/raw/main/$f" || echo "No bajó $f"
          done

      - name: Investigar, escribir y diseñar
        id: gen
        run: |
          python -m fabrica.main generar
          if [ -f out/publicacion.json ]; then echo "hay=true" >> "$GITHUB_OUTPUT"; else echo "hay=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/configure-pages@v5
        if: steps.gen.outputs.hay == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.gen.outputs.hay == 'true'
        with:
          path: out/sitio

      - id: deployment
        if: steps.gen.outputs.hay == 'true'
        uses: actions/deploy-pages@v4

      - name: Esperar a que los archivos estén online
        if: steps.gen.outputs.hay == 'true'
        run: |
          URL="${{ steps.deployment.outputs.page_url }}$(python -c "import json;print(json.load(open('out/publicacion.json'))['archivos']['video'])")"
          for i in $(seq 1 30); do
            if curl -sfI "$URL" > /dev/null; then echo "Online: $URL"; exit 0; fi
            sleep 10
          done
          echo "Los archivos no aparecieron online"; exit 1

      - name: Esperar a la hora del pedido
        if: ${{ steps.gen.outputs.hay == 'true' && github.event_name == 'schedule' }}
        run: python -m fabrica.main esperar_pedido

      - name: Publicar en las redes
        if: ${{ steps.gen.outputs.hay == 'true' && (github.event_name == 'schedule' || inputs.publicar) }}
        run: python -m fabrica.main publicar --base-url "${{ steps.deployment.outputs.page_url }}"

      - name: Resumen (sin publicar)
        if: ${{ steps.gen.outputs.hay == 'true' && github.event_name == 'workflow_dispatch' && !inputs.publicar }}
        run: python -m fabrica.main resumen --base-url "${{ steps.deployment.outputs.page_url }}"

      - name: Guardar historial
        if: always()
        run: |
          git config user.name "fabrica-bot"
          git config user.email "fabrica-bot@users.noreply.github.com"
          git add data 2>/dev/null || true
          git add publicaciones 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Video extra $(date +%F) [skip ci]"
          git push || (git pull --rebase && git push)
